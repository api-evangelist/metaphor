name: Metaphor
description: >-
  Metaphor was an active-metadata / data-catalog platform (metaphor.io) that combined a
  social, agent-assisted data governance experience with a large library of open-source
  Python "connectors" that extracted metadata (schemas, lineage, usage, ownership,
  documentation, data quality) from warehouses, BI tools, and data pipelines to populate
  the Metaphor app. Founded by ex-LinkedIn DataHub engineers and backed by Amplify Partners,
  Metaphor's technology platform was acquired by KPMG; the metaphor.io site now redirects to
  the KPMG acquisition announcement and the standalone developer surface (docs.metaphor.io,
  api.metaphor.io, the MetaphorData GitHub org) has been decommissioned. The first-party
  open-source metadata packages (metaphor-connectors, metaphor-models) still resolve on PyPI.
